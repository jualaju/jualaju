<svg viewBox="0 0 760 210" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      text {
        font-family: ui-monospace, SFMono-Regular, 'Cascadia Mono', monospace;
      }

      @media (prefers-color-scheme: dark) {
        .e-main { stroke: rgba(210,210,210,0.18); }
        .e      { stroke: rgba(210,210,210,0.10); }

        .n-root      { fill: rgba(230,230,230,1); }
        .n-primary   { fill: rgba(210,210,210,0.90); }
        .n-focus     { fill: rgba(195,155,70,0.90); }
        .n-secondary { fill: rgba(135,135,135,0.75); }
        .n-leaf      { fill: rgba(155,155,155,0.70); }
        .n-deep      { fill: rgba(100,100,100,0.55); }

        .l-root      { fill: rgba(230,230,230,0.90); }
        .l-primary   { fill: rgba(210,210,210,0.75); }
        .l-focus     { fill: rgba(195,155,70,0.90); }
        .l-secondary { fill: rgba(135,135,135,0.65); }
        .l-leaf      { fill: rgba(155,155,155,0.68); }
        .l-deep      { fill: rgba(100,100,100,0.50); }

        .pt { fill: rgba(210,210,210,0.40); }
      }

      @media (prefers-color-scheme: light) {
        .e-main { stroke: rgba(40,40,40,0.16); }
        .e      { stroke: rgba(40,40,40,0.09); }

        .n-root      { fill: rgba(15,15,15,1); }
        .n-primary   { fill: rgba(35,35,35,0.90); }
        .n-focus     { fill: rgba(155,110,25,0.90); }
        .n-secondary { fill: rgba(145,145,145,0.70); }
        .n-leaf      { fill: rgba(105,105,105,0.70); }
        .n-deep      { fill: rgba(170,170,170,0.55); }

        .l-root      { fill: rgba(15,15,15,0.90); }
        .l-primary   { fill: rgba(35,35,35,0.75); }
        .l-focus     { fill: rgba(155,110,25,0.90); }
        .l-secondary { fill: rgba(145,145,145,0.65); }
        .l-leaf      { fill: rgba(105,105,105,0.68); }
        .l-deep      { fill: rgba(170,170,170,0.50); }

        .pt { fill: rgba(40,40,40,0.28); }
      }
    </style>

    <!-- main branches -->
    <path id="p01" d="M62,105 L205,42"/>
    <path id="p02" d="M62,105 L205,105"/>
    <path id="p03" d="M62,105 L205,168"/>

